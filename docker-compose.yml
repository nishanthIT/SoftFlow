name: sentinelscan
x-app: &app
  build: ./backend
  env_file: .env
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=128m,noexec,nosuid
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 2g
  cpus: 2
  volumes:
    - ./yara:/yara:ro
    - ./ai-signatures:/ai-signatures:ro
  networks: [data, egress]
services:
  proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, api]
    restart: unless-stopped
    networks: [edge]
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
  api:
    <<: *app
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [edge, data]
  worker:
    <<: *app
    command: [celery, -A, app.tasks, worker, --loglevel=INFO, --concurrency=2, --max-tasks-per-child=20]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
  scheduler:
    <<: *app
    command: [celery, -A, app.tasks, beat, --loglevel=INFO, --schedule=/tmp/celerybeat-schedule]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    networks: [data]
  migrate:
    <<: *app
    restart: "no"
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sentinel"]
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [data]
  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      retries: 20
    restart: unless-stopped
    networks: [data]
  minio:
    build: ./deploy/minio
    image: sentinelscan-minio:2025-10-15
    pull_policy: build
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes: ["minio-data:/data"]
    restart: unless-stopped
    networks: [data]
  storage-init:
    <<: *app
    restart: "no"
    command: [python, -m, app.init_storage]
    depends_on: [minio]
    networks: [data]
volumes:
  postgres-data:
  redis-data:
  minio-data:
networks:
  edge:
  data:
    internal: true
  egress:
